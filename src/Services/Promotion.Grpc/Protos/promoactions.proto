syntax = "proto3";

package promotion.grpc.services;

service PromoService {
  // Возвращает объект промоакции по Id элемента каталога
  rpc GetPromo (GetPromoRequest) returns (PromoDto);
  
  // Выполняет Upsert объекта промоакции. Возвращает статус-код 0, если запись создается впервые, и 6 - если обновляется
  rpc StorePromo (PromoDto) returns (Empty);
  
  rpc DeletePromo(DeletePromoRequest) returns (Empty);
}

message GetPromoRequest {
  string catalog_item_id = 1;
}

message PromoDto {
  string catalog_item_id = 1;
  string title = 2;
  DecimalValue value = 3;
}

message DeletePromoRequest {
  string catalog_item_id = 1;
}

// Example: 12345.6789 -> { units = 12345, nanos = 678900000 }
message DecimalValue {

  // Whole units part of the amount
  int64 units = 1;
  // Nano units of the amount (10^-9)
  sfixed32 nanos = 2;
}

message Empty {}